name: mvc_swagger_codegen
description: A command-line tool to generate Provider-based MVC architecture and API controllers directly from a Swagger JSON file.
version: 0.0.3
homepage: https://github.com/imilham/mvc_swagger_codegen

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.4.2
  path: ^1.9.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0

executables:
  mvc_swagger_codegen: generate